modules:
  - module: GUET-PLDX/Gimbal
    args:
      - cmd: cmd
      - motor_pit: motor_pit
      - motor_yaw: motor_yaw
      - motor_syaw: motor_syaw
      - motor_fold: motor_fold
      - param:
          task_stack_depth: 2048
          manual:
            pid_pit_angle: {k: 1.0, p: 2.0, i: 0.0, d: 0.0, i_limit: 0.0, out_limit: 8.0, cycle: false}
            pid_pit_omega: {k: 1.0, p: 0.4, i: 0.0, d: 0.0, i_limit: 0.0, out_limit: 2.0, cycle: false}
            yaw_smc: {c: 20.0, k: 120.0, epsilon: 0.5, q: 21.0, p: 27.0, error_deadband_rad: 0.0, ftsmc_switch_rad: 0.0174532925, sat_boundary: 1.0, ftsmc_enable: true}
            syaw_smc: {c: 20.0, k: 120.0, epsilon: 0.5, q: 21.0, p: 27.0, error_deadband_rad: 0.0, ftsmc_switch_rad: 0.0174532925, sat_boundary: 1.0, ftsmc_enable: true}
          auto_aim:
            pid_pit_angle: {k: 1.0, p: 2.0, i: 0.0, d: 0.0, i_limit: 0.0, out_limit: 8.0, cycle: false}
            pid_pit_omega: {k: 1.0, p: 0.4, i: 0.0, d: 0.0, i_limit: 0.0, out_limit: 2.0, cycle: false}
            yaw_smc: {c: 20.0, k: 120.0, epsilon: 0.5, q: 21.0, p: 27.0, error_deadband_rad: 0.0, ftsmc_switch_rad: 0.0174532925, sat_boundary: 1.0, ftsmc_enable: true}
            syaw_smc: {c: 20.0, k: 120.0, epsilon: 0.5, q: 21.0, p: 27.0, error_deadband_rad: 0.0, ftsmc_switch_rad: 0.0174532925, sat_boundary: 1.0, ftsmc_enable: true}
          yaw_output_limits:
            torque_soft_limit_nm: 2.0
            torque_min_nm: -2.223
            torque_max_nm: 2.223
            torque_slew_rate_nm_s: 1000.0
            torque_slew_enable: true
          two_axis_ik:
            imu_at_end: true
            yaw_sign: 1.0
            pitch_sign: 1.0
            yaw_zero_rad: 0.0
            pitch_zero_rad: 0.0
            yaw_min_rad: -3.141593
            yaw_max_rad: 3.141593
            pitch_min_rad: -0.785398
            pitch_max_rad: 0.785398
          yaw_follow:
            enabled: false
            deadband_rad: 0.02
          pit_lc: 0.0
          pit_theta: 0.0
          j_pit: 0.014
          j_yaw: 0.03953
          j_syaw: 0.03953
          yaw_zero: 0.0
          imu_timeout_s: 0.05
          patrol_pitch_amplitude_rad: 0.087266
          patrol_pitch_angular_rate_rad_s: 1.570796
          patrol_yaw_rate_rad_s: 0.2
          patrol_imu_timeout_s: 0.05
          thread_priority: LibXR::Thread::Priority::MEDIUM
          system_identify:
            enabled: false
            axis_select: IdentifyAxis::BOTH
            arming_delay_s: 3.0
            step_torque_yaw_nm: 0.5
            step_torque_pit_nm: 0.2
            step_half_period_s: 0.5
            step_cycles: 10
            settle_time_s: 1.0
            lpf_cutoff_hz: 50.0
            alpha_gate_rad_s2: 1.0
            rls_delta: 1000.0
            rls_lambda: 1.0
            coulomb_tanh_scale: 0.1
            omega_abort_yaw: 8.0
            omega_abort_pit: 4.0
            pit_angle_margin_rad: 0.1
            axis_timeout_s: 30.0
          euler_topic_name: gimbal_euler
          gyro_topic_name: gimbal_gyro
          gimbal_cmd_topic_name: gimbal_cmd
